# Alembic configuration file.

[alembic]
# Location of the Alembic migration environment.
script_location = alembic

# Database URL is loaded dynamically from app.core.config.
# sqlalchemy.url is intentionally left unused.
sqlalchemy.url =

# Migration file naming format.
file_template = %%(rev)s_%%(slug)s

# Encoding used for migration files.
output_encoding = utf-8